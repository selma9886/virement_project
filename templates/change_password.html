<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Changer le mot de passe</title>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e6f0ff, #f9fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 380px;
      text-align: center;
    }

    h2 {
      color: #004aad;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #004aad;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #003b8a;
    }

    .flash {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .success {
      background: #e8f8f1;
      color: #20633d;
    }

    .error {
      background: #fdecea;
      color: #a71d2a;
    }

    a {
      color: #004aad;
      text-decoration: none;
      font-size: 13px;
    }
  </style>

</head>

<body>

<div class="card">

<h2>Changer le mot de passe</h2>

{% if messages %}
  {% for message in messages %}
    <div class="flash {{ message.tags }}">{{ message }}</div>
  {% endfor %}
{% endif %}

<form method="POST" action="{% url 'change_password' %}">

{% csrf_token %}

<label>Ancien mot de passe</label>
<input type="password" name="old_password" required>

<label>Nouveau mot de passe</label>
<input type="password" name="new_password" required>

<label>Confirmer le mot de passe</label>
<input type="password" name="confirm_password" required>

<button type="submit">
Mettre à jour
</button>

</form>

<div style="margin-top:15px;">
<a href="{% url 'index' %}">⬅ Retour</a>
</div>

</div>

</body>
</html>
