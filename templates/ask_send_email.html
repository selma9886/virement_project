<!-- Modal 1: Demande d'envoi -->
<div class="modal fade" id="askEmailModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="fas fa-envelope"></i> Envoyer par email ?
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Souhaitez-vous envoyer le fichier <strong>{{ file_name }}</strong> par email ?</p>
        <p class="text-muted small">Vous pourrez saisir l'email expéditeur et destinataire.</p>
      </div>
      <div class="modal-footer">
        <a href="{% url 'skip_send_email' file_id %}" class="btn btn-secondary">
          <i class="fas fa-times"></i> Non
        </a>
        <a href="{% url 'send_email_form' file_id %}" class="btn btn-primary">
          <i class="fas fa-check"></i> Oui
        </a>
      </div>
    </div>
  </div>
</div>
