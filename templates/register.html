{% load static %}
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BNM - Inscription</title>

<link rel="icon" type="image/png" href="{% static 'img/bnm_logo.png' %}">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  width: 450px;
  max-width: 100%;
  animation: slideUp 0.5s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card img {
  height: 70px;
  display: block;
  margin: 0 auto 15px;
}

h2 {
  color: #004aad;
  text-align: center;
  margin-bottom: 25px;
  font-size: 24px;
}

label {
  display: block;
  text-align: left;
  font-weight: 600;
  margin-bottom: 5px;
  color: #333;
  font-size: 14px;
}

input, select {
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 14px;
  transition: all 0.3s;
}

input:focus, select:focus {
  outline: none;
  border-color: #004aad;
  box-shadow: 0 0 0 3px rgba(0,74,173,0.1);
}

button {
  width: 100%;
  padding: 12px;
  background: #004aad;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 10px;
}

button:hover {
  background: #003b8a;
  transform: translateY(-2px);
}

.flash {
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
}

.flash.success {
  background: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}

.flash.error {
  background: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}

.flash.warning {
  background: #fff3cd;
  color: #856404;
  border: 1px solid #ffeaa7;
}

.login-link {
  text-align: center;
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px solid #eee;
  font-size: 14px;
}

.login-link a {
  color: #004aad;
  text-decoration: none;
  font-weight: 600;
}

.login-link a:hover {
  text-decoration: underline;
}

footer {
  margin-top: 20px;
  text-align: center;
  font-size: 12px;
  color: #777;
}

.role-select {
  margin-bottom: 15px;
}

.role-select label {
  margin-bottom: 8px;
}

.role-select select {
  background: white;
  cursor: pointer;
}

.role-info {
  font-size: 12px;
  color: #666;
  margin-top: -10px;
  margin-bottom: 15px;
  padding: 5px;
  background: #f8f9fa;
  border-radius: 5px;
  text-align: center;
}

.password-strength {
  font-size: 12px;
  margin-top: -10px;
  margin-bottom: 10px;
  padding: 5px;
  border-radius: 5px;
}

.password-strength.weak {
  color: #dc3545;
  background: #f8d7da;
}

.password-strength.medium {
  color: #ffc107;
  background: #fff3cd;
}

.password-strength.strong {
  color: #28a745;
  background: #d4edda;
}

@media (max-width: 480px) {
  .card {
    padding: 25px;
  }
  
  h2 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="card">

<img src="{% static 'img/bnm_logo.png' %}" alt="BNM Logo">

<h2>BNM - Inscription</h2>

{% if messages %}
  {% for message in messages %}
    <div class="flash {% if message.tags %}{{ message.tags }}{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<form method="POST" id="registerForm">
{% csrf_token %}

<label>Nom complet</label>
<input type="text" name="fullname" id="fullname" placeholder="Jean Dupont" required>

<label>Email</label>
<input type="email" name="email" id="email" placeholder="jean@bnm.mr" required>

<label>Mot de passe</label>
<input type="password" name="password1" id="password1" placeholder="********" required>
<div id="passwordStrength" class="password-strength"></div>

<label>Confirmer mot de passe</label>
<input type="password" name="password2" id="password2" placeholder="********" required>
<div id="passwordMatch" class="password-strength"></div>

<div class="role-select">
  <label>Type de compte</label>
  <select name="role" id="role">
    <option value="user">👤 Utilisateur Standard</option>
    <option value="admin">👑 Administrateur</option>
  </select>
  <div class="role-info" id="roleInfo">
    ℹ️ L'administrateur peut gérer tous les utilisateurs et fichiers
  </div>
</div>

<button type="submit">Créer un compte</button>

<div class="login-link">
  Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a>
</div>

</form>

<footer>© 2025 Banque Nationale de Mauritanie</footer>

</div>

<script>
// Fonction pour vérifier la force du mot de passe
function checkPasswordStrength(password) {
    let strength = 0;
    
    if (password.length >= 8) strength++;
    if (password.match(/[a-z]+/)) strength++;
    if (password.match(/[A-Z]+/)) strength++;
    if (password.match(/[0-9]+/)) strength++;
    if (password.match(/[$@#&!]+/)) strength++;
    
    if (password.length === 0) return { level: '', text: '' };
    
    if (strength <= 2) {
        return { level: 'weak', text: '⚠️ Mot de passe faible' };
    } else if (strength === 3 || strength === 4) {
        return { level: 'medium', text: '⚡ Mot de passe moyen' };
    } else {
        return { level: 'strong', text: '✅ Mot de passe fort' };
    }
}

// Fonction pour vérifier si les mots de passe correspondent
function checkPasswordMatch(password1, password2) {
    if (password2.length === 0) return { level: '', text: '' };
    
    if (password1 === password2) {
        return { level: 'strong', text: '✅ Les mots de passe correspondent' };
    } else {
        return { level: 'weak', text: '❌ Les mots de passe ne correspondent pas' };
    }
}

// Mettre à jour les informations selon le rôle sélectionné
function updateRoleInfo() {
    const role = document.getElementById('role').value;
    const roleInfo = document.getElementById('roleInfo');
    
    if (role === 'admin') {
        roleInfo.innerHTML = '👑 <strong>Administrateur</strong> - Vous aurez accès à toutes les fonctionnalités : gestion des utilisateurs, fichiers, et génération XML.';
        roleInfo.style.background = '#e3f2fd';
        roleInfo.style.color = '#004aad';
    } else {
        roleInfo.innerHTML = '👤 <strong>Utilisateur Standard</strong> - Vous pourrez gérer vos fichiers et générer des rapports XML.';
        roleInfo.style.background = '#f8f9fa';
        roleInfo.style.color = '#666';
    }
}

// Écouteurs d'événements
document.addEventListener('DOMContentLoaded', function() {
    const password1 = document.getElementById('password1');
    const password2 = document.getElementById('password2');
    const passwordStrengthDiv = document.getElementById('passwordStrength');
    const passwordMatchDiv = document.getElementById('passwordMatch');
    const roleSelect = document.getElementById('role');
    const form = document.getElementById('registerForm');
    
    // Vérifier la force du mot de passe en temps réel
    password1.addEventListener('input', function() {
        const strength = checkPasswordStrength(this.value);
        passwordStrengthDiv.textContent = strength.text;
        passwordStrengthDiv.className = 'password-strength ' + strength.level;
        
        // Si le deuxième champ n'est pas vide, vérifier aussi la correspondance
        if (password2.value.length > 0) {
            const match = checkPasswordMatch(password1.value, password2.value);
            passwordMatchDiv.textContent = match.text;
            passwordMatchDiv.className = 'password-strength ' + match.level;
        }
    });
    
    // Vérifier la correspondance des mots de passe
    password2.addEventListener('input', function() {
        const match = checkPasswordMatch(password1.value, this.value);
        passwordMatchDiv.textContent = match.text;
        passwordMatchDiv.className = 'password-strength ' + match.level;
    });
    
    // Mettre à jour les informations du rôle
    roleSelect.addEventListener('change', updateRoleInfo);
    
    // Validation avant soumission
    form.addEventListener('submit', function(e) {
        // Vérifier que les mots de passe correspondent
        if (password1.value !== password2.value) {
            e.preventDefault();
            passwordMatchDiv.textContent = '❌ Les mots de passe ne correspondent pas';
            passwordMatchDiv.className = 'password-strength weak';
            passwordMatchDiv.style.display = 'block';
            
            // Afficher un message d'erreur
            const errorDiv = document.createElement('div');
            errorDiv.className = 'flash error';
            errorDiv.textContent = 'Les mots de passe ne correspondent pas';
            form.insertBefore(errorDiv, form.firstChild);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
            
            return false;
        }
        
        // Vérifier la longueur du mot de passe
        if (password1.value.length < 6) {
            e.preventDefault();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'flash error';
            errorDiv.textContent = 'Le mot de passe doit contenir au moins 6 caractères';
            form.insertBefore(errorDiv, form.firstChild);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
            
            return false;
        }
        
        // Vérifier le format de l'email
        const email = document.getElementById('email').value;
        const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        if (!emailRegex.test(email)) {
            e.preventDefault();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'flash error';
            errorDiv.textContent = 'Veuillez entrer une adresse email valide';
            form.insertBefore(errorDiv, form.firstChild);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
            
            return false;
        }
        
        // Vérifier que le nom n'est pas vide
        const fullname = document.getElementById('fullname').value;
        if (fullname.trim().length < 2) {
            e.preventDefault();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'flash error';
            errorDiv.textContent = 'Veuillez entrer votre nom complet';
            form.insertBefore(errorDiv, form.firstChild);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
            
            return false;
        }
        
        return true;
    });
    
    // Initialiser les informations du rôle
    updateRoleInfo();
});

// Fonction pour afficher un message de confirmation
function showMessage(message, type) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `flash ${type}`;
    messageDiv.textContent = message;
    const form = document.getElementById('registerForm');
    form.insertBefore(messageDiv, form.firstChild);
    
    setTimeout(() => {
        messageDiv.remove();
    }, 5000);
}
</script>

</body>
</html>
