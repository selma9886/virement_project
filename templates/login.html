{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BNM - Connexion</title>
  <link rel="icon" type="image/png" href="{% static 'img/bnm_logo.png' %}">

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e6f0ff, #f9fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-card {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 380px;
      text-align: center;
    }

    .login-card img {
      height: 70px;
      margin-bottom: 15px;
    }

    h2 {
      color: #004aad;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #004aad;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #003b8a;
    }

    .flash {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #fdecea;
      color: #a71d2a;
    }

    footer {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="login-card">


<img src="{% static 'img/bnm_logo.png' %}" alt="Logo">



  <h2>BNM - Connexion</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST" action="{% url 'login' %}">

    {% csrf_token %}

    <label>Email</label>
    <input type="email" name="email" placeholder="admin@bnm.mr" required>

    <label>Mot de passe</label>
    <input type="password" name="password" placeholder="********" required>

    <button type="submit">Se connecter</button>

    <p style="margin-top:10px;">
Pas de compte ?
<a href="{% url 'register' %}">Créer un compte</a>
</p>


  </form>

  <footer>© 2025 Banque Nationale de Mauritanie</footer>

</div>

</body>
</html>
