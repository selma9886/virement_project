services:
  db:
    image: mysql:8.0
    container_name: virement_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: virement_db
      MYSQL_USER: virement
      MYSQL_PASSWORD: virement
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - virement_network

  web:
    build: .
    container_name: virement_web
    restart: unless-stopped
    command: sh -c "sleep 10 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8084:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: virement_db
      DB_USER: virement
      DB_PASSWORD: virement
      DB_PORT: 3306
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1,192.168.1.48,0.0.0.0"
      PYTHONUNBUFFERED: "1"
    networks:
      - virement_network

networks:
  virement_network:
    driver: bridge

volumes:
  mysql_data:
